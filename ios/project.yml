name: SiliconBuddy
options:
  bundleIdPrefix: dev.siliconoptimizer
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Sign to run locally. An unsigned Simulator build has no entitlements at all, and
    # the first thing that fails is the Keychain: SecItemAdd answers
    # errSecMissingEntitlement (-34018) and pairing cannot store its token.
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"

targets:
  SiliconBuddy:
    type: application
    platform: iOS
    sources:
      - path: SiliconBuddy
    # The two extensions ride inside the app bundle. Building the app builds them, and
    # installing it on a Simulator registers the widget and the share sheet with it.
    dependencies:
      - target: SiliconBuddyWidgets
        embed: true
      - target: SiliconBuddyShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.siliconoptimizer.buddy
        # The bundle is SiliconBuddy.app; the home screen shows CFBundleDisplayName,
        # "Silicon Buddy". A product name with a space in it breaks TEST_HOST.
        PRODUCT_NAME: SiliconBuddy
        INFOPLIST_FILE: SiliconBuddy/Info.plist
        CODE_SIGN_ENTITLEMENTS: SiliconBuddy/SiliconBuddy.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_ASSET_PATHS: ""

  # The widget and the share sheet compile the app's own Transport and Reach sources
  # rather than linking a framework. Three small targets compiling the same dozen files
  # is less machinery than an embedded framework, and it keeps the extensions honest:
  # they get the app's `TailnetHost` and the app's `TokenStore`, so a request from a
  # widget passes exactly the gate a request from the app does.
  SiliconBuddyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SiliconBuddyWidgets
      - path: SiliconBuddy/Transport
      - path: SiliconBuddy/Reach
      - path: SiliconBuddy/Pairing/TokenStore.swift
      - path: SiliconBuddy/Pairing/PairingInvite.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.siliconoptimizer.buddy.widgets
        PRODUCT_NAME: SiliconBuddyWidgets
        INFOPLIST_FILE: SiliconBuddyWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: SiliconBuddyWidgets/SiliconBuddyWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  SiliconBuddyShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SiliconBuddyShare
      - path: SiliconBuddy/Transport
      - path: SiliconBuddy/Reach
      - path: SiliconBuddy/Pairing/TokenStore.swift
      - path: SiliconBuddy/Pairing/PairingInvite.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.siliconoptimizer.buddy.share
        PRODUCT_NAME: SiliconBuddyShare
        INFOPLIST_FILE: SiliconBuddyShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: SiliconBuddyShare/SiliconBuddyShare.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  SiliconBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SiliconBuddyTests
      # The contract fixtures captured from the running Mac app. A folder reference so
      # adding a fixture never means editing the project.
      - path: ../contract
        type: folder
        buildPhase: resources
    dependencies:
      - target: SiliconBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.siliconoptimizer.buddy.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SiliconBuddy.app/SiliconBuddy"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  SiliconBuddy:
    build:
      targets:
        SiliconBuddy: all
        SiliconBuddyWidgets: all
        SiliconBuddyShare: all
        SiliconBuddyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SiliconBuddyTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
