name: Android

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Release build with R8
        # x86_64 so the same artifact could be installed on a CI emulator; the keep-rule
        # and size checks below do not care which ABI it holds.
        run: ./gradlew assembleRelease -Pbuddy.abis=x86_64

      # The reason this job exists.
      #
      # R8 cannot see an edge that goes through a class *name*: Glance writes an
      # ActionCallback's name into a RemoteViews action and instantiates it later, and
      # kotlinx.serialization reaches every wire type through a generated $$serializer.
      # Lose either and the build still succeeds — the widget's button just quietly stops
      # working, and the app fails to parse anything the Mac sends. seeds.txt is R8's own
      # list of what it was told to keep, so it is the cheapest honest check there is.
      - name: The keep rules actually kept things
        run: |
          seeds=app/build/outputs/mapping/release/seeds.txt
          test -f "$seeds" || { echo "::error::no seeds.txt — did R8 run?"; exit 1; }

          for class in AskQuickPromptAction ClearQuickAnswerAction; do
            if ! grep -q "dev.siliconoptimizer.buddy.widget.$class$" "$seeds"; then
              echo "::error::$class was not kept — the widget's button is a no-op in release"
              exit 1
            fi
          done

          serializers=$(grep -oE '^[A-Za-z0-9_.]+\$\$serializer' "$seeds" | sort -u | wc -l)
          echo "kept $serializers serializers"
          if [ "$serializers" -lt 48 ]; then
            echo "::error::only $serializers serializers kept, expected at least 48"
            exit 1
          fi

      - name: APK size
        run: |
          # Signed when a debug keystore exists, unsigned otherwise; CI has neither
          # guaranteed, so take whichever is there.
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          bytes=$(stat -c%s "$apk")
          echo "release APK: $((bytes / 1048576)) MB"
          # Release was 75 MB unminified. A regression here means R8 or the resource
          # shrinker stopped running, which is the same failure as the keep rules in
          # reverse — worth failing on rather than noticing in six months.
          if [ "$bytes" -gt 31457280 ]; then
            echo "::error::release APK is $((bytes / 1048576)) MB; R8 has probably stopped running"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  instrumented:
    # The Glance keep rule is checked statically above; this runs the minified build on a
    # real Android and asks the system to resolve the callback, which is the thing that
    # actually breaks. Emulators on CI are slow and flaky enough that it should not gate
    # a pull request on its own.
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on the minified build
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          working-directory: android
          # The point is the *minified* build — `testBuildType` is release, so a debug
          # APK is not even what gets installed. `abiFilters` defaults to arm64 for the
          # owner's devices, so CI puts x86_64 back for its emulator.
          script: ./gradlew connectedReleaseAndroidTest -Pbuddy.abis=x86_64
